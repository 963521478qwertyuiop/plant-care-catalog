spring.application.name=plant-care-catalog
server.port=8080

# Настройки базы данных (пока для локального запуска, потом поменяем для Docker)
spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/plantdb?sslmode=disable&prepareThreshold=0
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect