<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Растение</title>
</head>
<body>
    <!-- Заголовок меняется в зависимости от того, создаем мы или редактируем -->
    <h1 th:text="${plant.id != null ? 'Редактировать растение' : 'Новое растение'}"></h1>
    
    <!-- Если ID есть, отправляем на /update/{id}, если нет — на /plants -->
    <form action="#" th:action="${plant.id != null ? '/plants/update/' + plant.id : '/plants'}" th:object="${plant}" method="post">
        <p>Название: <input type="text" th:field="*{name}" required/></p>
        <p>Полив (раз в дней): <input type="number" th:field="*{wateringIntervalDays}" required/></p>
        <p>Освещение (LOW, MEDIUM, HIGH): <input type="text" th:field="*{lightLevel}" required/></p>
        <p><button type="submit">Сохранить</button></p>
    </form>
    <a th:href="@{/plants}">Назад</a>
</body>
</html>
