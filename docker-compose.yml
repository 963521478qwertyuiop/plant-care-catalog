version: '3.8'
services:
  db:
    image: postgres:15
    container_name: plant_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plantdb
    ports:
      - "5433:5432" # ВАЖНО: наружу отдаём 5433, чтобы не конфликтовать с твоим локальным постгресом
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: